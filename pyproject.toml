[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paletizador"
version = "0.1.0"
description = "Proyecto de paletizado (simulacion y politicas)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "numpy>=1.24",
  "matplotlib>=3.7",
]
