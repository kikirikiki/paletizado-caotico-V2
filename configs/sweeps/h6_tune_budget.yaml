# Ajuste del margen de tiempo real de H6 (prior genérico): presupuesto, hojas y cajas futuras. Director (D-011), seeds de ajuste.
- name: h6_generic
  preset: arm6_4orient
  role: official
  overrides:
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 57
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
    micro_plan_value: rollout
    micro_plan_rollout_leaves: 2
    rollout_future_boxes: 6
    rollout_future_samples: 1
    rollout_prior: generic
