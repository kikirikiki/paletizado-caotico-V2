# Baseline vigente: arm6_4orient_H1H3H5 (referencia oficial).
# Sin técnicas: micro_plan=False y access_debt_mode=off, defaults del preset.
# PALANCA / PLAN_B: garra alternativa HxL, delta 400; no es oficial arm6.
# CONTRASTE: gantry con seis orientaciones reales, delta 0.
- name: arm6_4orient
  preset: arm6_4orient
  role: control
  overrides: {}
- name: lever_arm_canto
  preset: lever_arm_canto
  role: lever
  overrides: {}
- name: gantry_6orient
  preset: gantry_6orient
  role: contrast
  overrides: {}
- name: arm6_4orient_H1H3H5
  preset: arm6_4orient
  role: official
  overrides: &h1h3h5
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 25
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
    micro_plan_value: rollout
    micro_plan_rollout_leaves: 4
- name: lever_arm_canto_H1H3H5
  preset: lever_arm_canto
  role: lever
  overrides: *h1h3h5
- name: gantry_6orient_H1H3H5
  preset: gantry_6orient
  role: contrast
  overrides: *h1h3h5
