# R13: geometry learned exclusively from independent GENERIC synthetic flows.
# Weights are preregistered here; real streams are used only for timing by spec 22.
- name: h6_sin_gate
  preset: arm6_4orient
  role: official
  overrides: &official
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 57
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
    micro_plan_value: rollout
    micro_plan_rollout_leaves: 2
    rollout_future_boxes: 6
    rollout_future_samples: 1
    rollout_prior: generic
    stand_hw_height_margin_gate_mm: 2400
    micro_plan_hard_cap_ms: 600000
- name: r13_learned
  preset: arm6_4orient
  role: contrast
  overrides:
    <<: *official
    micro_plan_value: learned
    rollout_future_boxes: 0
    learned_value_weight: 1.0
- name: r13_mix_w05
  preset: arm6_4orient
  role: contrast
  overrides:
    <<: *official
    micro_plan_value: rollout+learned
    # Fixed cost selected on synthetic flows, before timing real flows.
    # With 15 visible: 15 root expansions + 2 x 6 greedy scans. The model
    # values unfinished continuations; generic future is used if quota remains.
    micro_plan_node_budget: 27
    learned_value_weight: 0.5
- name: r13_mix_w1
  preset: arm6_4orient
  role: contrast
  overrides:
    <<: *official
    micro_plan_value: rollout+learned
    micro_plan_node_budget: 27
    learned_value_weight: 1.0
- name: r13_mix_w2
  preset: arm6_4orient
  role: contrast
  overrides:
    <<: *official
    micro_plan_value: rollout+learned
    micro_plan_node_budget: 27
    learned_value_weight: 2.0
