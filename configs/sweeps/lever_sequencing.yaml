# D-019 R4: palanca operativa; upstream secuencia, buffer online = 15.
# h6_generic conserva exactamente los overrides de h6_prior_eval.yaml.
- name: h6_generic
  preset: arm6_4orient
  role: control
  overrides:
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 57
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
    micro_plan_value: rollout
    micro_plan_rollout_leaves: 2
    rollout_future_boxes: 6
    rollout_future_samples: 1
    rollout_prior: generic
    arrival_sort_window: 0
    arrival_sort_key: family_height
