# D-025 / Spec 18. Baseline H6 sin gate unchanged; features are opt-in.
- name: h6_sin_gate
  preset: arm6_4orient
  role: official
  overrides:
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 57
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
