# G1 D-039. The checkpoint path is expanded by cached_value_net at load time.
- name: h6_sin_gate
  preset: arm6_4orient
  role: official
  overrides: &h6
    access_debt_mode: penalty
    access_debt_weight: 0.25
    access_debt_band_mm: 600
    micro_plan: true
    micro_plan_node_budget: 57
    micro_depth: 3
    micro_width: 8
    micro_topk: 15
    micro_plan_value: rollout
    micro_plan_rollout_leaves: 2
    rollout_future_boxes: 6
    rollout_future_samples: 1
    rollout_prior: generic
    stand_hw_height_margin_gate_mm: 2400
    micro_plan_hard_cap_ms: 600000
- name: g1_learned_b57
  preset: arm6_4orient
  role: control
  overrides: &g1
    <<: *h6
    micro_plan_value: learned
    rollout_future_boxes: 0
    learned_value_model: g1
    learned_value_model_path: ~/code/Paletizador/09_Software/models/g1_v1/value_g1.pt
    learned_value_device: cpu
    learned_value_weight: 1.0
- name: g1_learned_b150
  preset: arm6_4orient
  role: control
  overrides:
    <<: *g1
    micro_plan_node_budget: 150
- name: g1_mix_w05
  preset: arm6_4orient
  role: control
  overrides:
    <<: *g1
    micro_plan_value: rollout+learned
    rollout_future_boxes: 6
    learned_value_weight: 0.5
- name: g1_mix_w1
  preset: arm6_4orient
  role: control
  overrides: &mix
    <<: *g1
    micro_plan_value: rollout+learned
    rollout_future_boxes: 6
- name: g1_mix_w1_b150_l4
  preset: arm6_4orient
  role: control
  overrides:
    <<: *mix
    micro_plan_node_budget: 150
    micro_plan_rollout_leaves: 4
